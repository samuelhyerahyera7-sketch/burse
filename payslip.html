<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payslip — Burse Payroll</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    body { font-family:'Inter',sans-serif; background:#fff; color:#0e1c40; padding:0 0 40px; }
    .topnav { display:flex; align-items:center; gap:16px; padding:16px 20px; border-bottom:1px solid #e6eaf0; margin-bottom:28px; }
    .topnav .brand { font-size:1.2rem; font-weight:900; letter-spacing:-0.04em; text-decoration:none; color:#0e1c40; }
    .topnav .brand .b { color:#2ab3b3; }
    .topnav .back { margin-left:auto; font-size:0.85rem; font-weight:600; color:#3d5070; text-decoration:none; display:flex; align-items:center; gap:6px; }
    .topnav .back:hover { color:#0e1c40; }
    .topnav .back svg { width:16px; height:16px; }
    .sheet { max-width:720px; margin:0 auto; background:#fff; border-radius:14px; padding:36px; box-shadow:0 1px 3px rgba(10,20,60,0.08); border:1px solid #e6eaf0; }
    .top { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; border-bottom:2px solid #0e1c40; padding-bottom:18px; }
    .top h1 { font-size:1.3rem; font-weight:900; }
    .top .b { color:#2ab3b3; }
    .top p { font-size:0.78rem; color:#7a8fb0; margin-top:2px; }
    .meta { display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; font-size:0.82rem; margin-bottom:20px; }
    .meta div span:first-child { color:#7a8fb0; }
    .meta div { display:flex; justify-content:space-between; }
    h2.section { font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#7a8fb0; margin:20px 0 8px; }
    table { width:100%; border-collapse:collapse; font-size:0.85rem; }
    td { padding:6px 0; border-bottom:1px solid #eef1f6; }
    td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
    .total-row td { font-weight:800; border-top:2px solid #0e1c40; border-bottom:none; padding-top:10px; }
    .net-box { background:#0e1c40; color:#fff; border-radius:10px; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
    .net-box .label { font-size:0.8rem; color:rgba(255,255,255,0.6); }
    .net-box .val { font-size:1.4rem; font-weight:900; }
    .foot { margin-top:24px; font-size:0.72rem; color:#7a8fb0; line-height:1.6; }
    .btn-row { display:none; max-width:720px; margin:20px auto 0; justify-content:center; gap:10px; }
    .btn-row button { padding:10px 20px; border-radius:8px; font-weight:700; font-size:0.88rem; cursor:pointer; font-family:'Inter',sans-serif; }
    .btn-row .download-btn { background:#0e1c40; color:#fff; border:none; }
    .btn-row .download-btn:hover { background:#162050; }
    .btn-row .download-btn:disabled { opacity:0.6; cursor:not-allowed; }
    .btn-row .print-btn { background:#fff; color:#0e1c40; border:1.5px solid #e6eaf0; }
    .btn-row .print-btn:hover { border-color:#2ab3b3; color:#2ab3b3; }
    .loading, .error { text-align:center; padding:60px 20px; color:#7a8fb0; }
    @media print { .topnav { display:none; } body { background:#fff; padding:0; } .sheet { box-shadow:none; border-radius:0; border:none; } .btn-row { display:none !important; } }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="/"><span class="b">B</span>urse</a>
    <a class="back" href="/leave">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to My Payroll
    </a>
  </nav>
  <div class="sheet" id="sheet" style="margin-left:auto;margin-right:auto"><div class="loading">Loading payslip…</div></div>
  <div class="btn-row" id="btnRow">
    <button class="download-btn" id="downloadBtn" onclick="downloadPdf()">Download PDF</button>
    <button class="print-btn" id="printBtn" onclick="window.print()">Print</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase;
    const sb = createClient(
      'https://pnpfurfodmejdggnyjof.supabase.co',
      'sb_publishable_q2fnC5EJrToRNuvUjW619Q_NKMbO0iX'
    );

    function money(n) { return 'R ' + Number(n||0).toLocaleString('en-ZA', { minimumFractionDigits: 2 }); }
    function esc(str) { return String(str??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    (async function () {
      const { data: sessionData } = await sb.auth.getSession();
      if (!sessionData.session) { window.location.href = '/login'; return; }

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const sheet = document.getElementById('sheet');
      if (!id) { sheet.innerHTML = '<div class="error">No payslip specified.</div>'; return; }

      const { data: p, error } = await sb
        .from('payroll_payslips')
        .select('*, payroll_staff(*), payroll_runs(*, payroll_companies(*))')
        .eq('id', id)
        .single();

      if (error || !p) { sheet.innerHTML = '<div class="error">Payslip not found, or you do not have access to it.</div>'; return; }

      const staff = p.payroll_staff;
      const run = p.payroll_runs;
      const company = run.payroll_companies;

      const otherDeductions = Array.isArray(p.other_deductions_json) ? p.other_deductions_json : [];

      sheet.innerHTML = `
        <div class="top">
          <div>
            <h1><span class="b">B</span>urse Payroll</h1>
            <p>Payslip for ${esc(run.period_start)} to ${esc(run.period_end)}</p>
          </div>
          <div style="text-align:right">
            <p style="font-weight:700;color:#0e1c40">${esc(company?.trading_name || '')}</p>
            ${company?.address ? `<p>${esc(company.address)}</p>` : ''}
            <p>PAYE ${esc(company?.paye_reference || '—')}</p>
            <p>UIF ${esc(company?.uif_reference || '—')}</p>
          </div>
        </div>

        <div class="meta">
          <div><span>Employee</span><span style="font-weight:600">${esc(staff?.full_name)}</span></div>
          <div><span>Employee no.</span><span>${esc(staff?.employee_number || '—')}</span></div>
          <div><span>Job title</span><span>${esc(staff?.job_title || '—')}</span></div>
          <div><span>Tax number</span><span>${esc(staff?.tax_number || '—')}</span></div>
          <div><span>Pay frequency</span><span style="text-transform:capitalize">${esc(staff?.pay_frequency)}</span></div>
          <div><span>Pay date</span><span>${esc(run.pay_date)}</span></div>
          <div><span>Tax year</span><span>${esc(run.tax_year)}</span></div>
          <div><span>Status</span><span style="text-transform:capitalize">${esc(run.status)}</span></div>
        </div>

        <h2 class="section">Earnings</h2>
        <table>
          <tr><td>Basic salary</td><td>${money(p.basic_salary)}</td></tr>
          ${Number(p.travel_allowance) ? `<tr><td>Travel allowance</td><td>${money(p.travel_allowance)}</td></tr>` : ''}
          ${Number(p.other_taxable_allowance) ? `<tr><td>Other taxable allowance</td><td>${money(p.other_taxable_allowance)}</td></tr>` : ''}
          ${Number(p.other_nontaxable_allowance) ? `<tr><td>Other allowance (non-taxable)</td><td>${money(p.other_nontaxable_allowance)}</td></tr>` : ''}
          <tr class="total-row"><td>Gross pay</td><td>${money(p.gross_pay)}</td></tr>
        </table>

        <h2 class="section">Deductions</h2>
        <table>
          <tr><td>PAYE (income tax)</td><td>${money(p.paye)}</td></tr>
          <tr><td>UIF contribution</td><td>${money(p.uif_employee)}</td></tr>
          ${Number(p.retirement_contribution) ? `<tr><td>Retirement fund contribution</td><td>${money(p.retirement_contribution)}</td></tr>` : ''}
          ${otherDeductions.map(d => `<tr><td>${esc(d.label)}</td><td>${money(d.amount)}</td></tr>`).join('')}
          <tr class="total-row"><td>Total deductions</td><td>${money(p.total_deductions)}</td></tr>
        </table>

        <div class="net-box">
          <span class="label">Net pay</span>
          <span class="val">${money(p.net_pay)}</span>
        </div>

        <h2 class="section">Year to date</h2>
        <table>
          <tr><td>YTD gross</td><td>${money(p.ytd_gross)}</td></tr>
          <tr><td>YTD PAYE</td><td>${money(p.ytd_paye)}</td></tr>
          <tr><td>YTD UIF</td><td>${money(p.ytd_uif_employee)}</td></tr>
        </table>

        <p class="foot">
          Employer UIF contribution this period: ${money(p.uif_employer)} (not deducted from employee).
          ${company?.sdl_exempt ? '' : `SDL contribution: ${money(p.sdl_employer)} (employer-only, not deducted from employee).`}
          ${Number(p.eti_employer) ? ` Employment Tax Incentive claimed by employer: ${money(p.eti_employer)}.` : ''}
          This payslip is issued in terms of Section 33 of the Basic Conditions of Employment Act, 1997.
        </p>
      `;
      document.getElementById('btnRow').style.display = 'flex';
      window.__payslipFilename = `Payslip-${(staff?.full_name || 'employee').replace(/[^a-z0-9]+/gi, '-')}-${run.period_start}`;
    })();

    // Loaded on demand so a plain print doesn't pay for a PDF library it
    // doesn't need — html2pdf.js bundles html2canvas + jsPDF.
    function loadHtml2Pdf() {
      if (window.html2pdf) return Promise.resolve();
      if (window.__html2pdfLoading) return window.__html2pdfLoading;
      window.__html2pdfLoading = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('Could not load the PDF generator. Check your connection and try again.'));
        document.head.appendChild(s);
      });
      return window.__html2pdfLoading;
    }

    async function downloadPdf() {
      const btn = document.getElementById('downloadBtn');
      const original = btn.textContent;
      btn.disabled = true; btn.textContent = 'Preparing…';
      try {
        await loadHtml2Pdf();
        await window.html2pdf()
          .set({
            filename: `${window.__payslipFilename || 'payslip'}.pdf`,
            margin: 10,
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            html2canvas: { scale: 2, useCORS: true },
          })
          .from(document.getElementById('sheet'))
          .save();
      } catch (e) {
        alert(e.message || 'Could not generate the PDF. Try Print instead and choose "Save as PDF".');
      } finally {
        btn.disabled = false; btn.textContent = original;
      }
    }
  </script>
</body>
</html>
