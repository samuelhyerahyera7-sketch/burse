<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payslip — Burse Payroll</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin:0; padding:0; overflow-wrap: break-word; }
    body { font-family:'Inter',sans-serif; background:#fff; color:#0e1c40; padding:0 0 40px; }
    .topnav { display:flex; align-items:center; gap:16px; padding:16px 20px; border-bottom:1px solid #e6eaf0; margin-bottom:28px; }
    .topnav .brand { font-size:1.2rem; font-weight:900; letter-spacing:-0.04em; text-decoration:none; color:#0e1c40; }
    .topnav .brand .b { color:#2ab3b3; }
    .topnav .back { margin-left:auto; font-size:0.85rem; font-weight:600; color:#3d5070; text-decoration:none; display:flex; align-items:center; gap:6px; }
    .topnav .back:hover { color:#0e1c40; }
    .topnav .back svg { width:16px; height:16px; flex-shrink:0; }
    .sheet { max-width:720px; margin:0 auto; background:#fff; border-radius:14px; padding:36px; box-shadow:0 1px 3px rgba(10,20,60,0.08); border:1px solid #e6eaf0; }
    .top { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:24px; border-bottom:2px solid #0e1c40; padding-bottom:18px; }
    .top > div { min-width:0; }
    .top > div:last-child { text-align:right; }
    .top h1 { font-size:1.3rem; font-weight:900; }
    .top .b { color:#2ab3b3; }
    .top p { font-size:0.78rem; color:#7a8fb0; margin-top:2px; }
    .meta { display:grid; grid-template-columns:1fr 1fr; gap:6px 24px; font-size:0.82rem; margin-bottom:20px; }
    .meta div span:first-child { color:#7a8fb0; padding-right:10px; }
    .meta div span:last-child { text-align:right; min-width:0; }
    .meta div { display:flex; justify-content:space-between; min-width:0; }
    @media (max-width:520px) {
      .sheet { padding:20px; }
      .meta { grid-template-columns:1fr; }
      .net-box { flex-wrap:wrap; gap:6px; }
    }
    h2.section { font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:#7a8fb0; margin:20px 0 8px; page-break-after:avoid; break-after:avoid; }
    table { width:100%; border-collapse:collapse; font-size:0.85rem; }
    tr { page-break-inside:avoid; break-inside:avoid; }
    td { padding:6px 0; border-bottom:1px solid #eef1f6; }
    td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
    .total-row td { font-weight:800; border-top:2px solid #0e1c40; border-bottom:none; padding-top:10px; }
    .net-box { background:#0e1c40; color:#fff; border-radius:10px; padding:16px 20px; display:flex; justify-content:space-between; align-items:center; margin-top:20px; page-break-inside:avoid; break-inside:avoid; }
    .net-box .label { font-size:0.8rem; color:rgba(255,255,255,0.6); }
    .net-box .val { font-size:1.4rem; font-weight:900; }
    .foot { margin-top:24px; font-size:0.72rem; color:#7a8fb0; line-height:1.6; }
    .btn-row { display:none; max-width:720px; margin:20px auto 0; justify-content:center; gap:10px; }
    .btn-row button { padding:10px 20px; border-radius:8px; font-weight:700; font-size:0.88rem; cursor:pointer; font-family:'Inter',sans-serif; }
    .btn-row .download-btn { background:#0e1c40; color:#fff; border:none; }
    .btn-row .download-btn:hover { background:#162050; }
    .btn-row .download-btn:disabled { opacity:0.6; cursor:not-allowed; }
    .btn-row .print-btn { background:#fff; color:#0e1c40; border:1.5px solid #e6eaf0; }
    .btn-row .print-btn:hover { border-color:#2ab3b3; color:#2ab3b3; }
    .loading, .error { text-align:center; padding:60px 20px; color:#7a8fb0; }
    @media print { .topnav { display:none; } body { background:#fff; padding:0; } .sheet { box-shadow:none; border-radius:0; border:none; } .btn-row { display:none !important; } }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="/"><span class="b">B</span>urse</a>
    <a class="back" href="/leave">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
      Back to My Payroll
    </a>
  </nav>
  <div class="sheet" id="sheet" style="margin-left:auto;margin-right:auto"><div class="loading">Loading payslip…</div></div>
  <div class="btn-row" id="btnRow">
    <button class="download-btn" id="downloadBtn" onclick="downloadPdf()">Download PDF</button>
    <button class="print-btn" id="printBtn" onclick="window.print()">Print</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Must match the storage adapter in login.html exactly — see comment there.
    // On the real burse.co.za domain this uses a Domain=.burse.co.za cookie
    // so this session is also visible to Bookkeeping's own subdomain.
    function burseGetRemember() { return localStorage.getItem('burse-remember') !== '0'; }

    const burseAuthStorage = (() => {
      const onProdDomain = location.hostname.endsWith('burse.co.za');
      if (!onProdDomain) {
        return {
          getItem: (key) => (burseGetRemember() ? window.localStorage : window.sessionStorage).getItem(key),
          setItem: (key, value) => (burseGetRemember() ? window.localStorage : window.sessionStorage).setItem(key, value),
          removeItem: (key) => (burseGetRemember() ? window.localStorage : window.sessionStorage).removeItem(key),
        };
      }
      const COOKIE_DOMAIN = '.burse.co.za';
      const CHUNK_SIZE = 3000;
      function cookieGet(name) {
        const m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
        return m ? decodeURIComponent(m[1]) : null;
      }
      function cookieSet(name, value, days) {
        document.cookie = `${name}=${encodeURIComponent(value)}; path=/; domain=${COOKIE_DOMAIN}; max-age=${days * 86400}; samesite=lax; secure`;
      }
      function cookieRemove(name) {
        document.cookie = `${name}=; path=/; domain=${COOKIE_DOMAIN}; max-age=0`;
      }
      return {
        getItem: (key) => {
          if (!burseGetRemember()) return sessionStorage.getItem(key);
          const n = cookieGet(key + '__n');
          if (n === null) return cookieGet(key);
          let value = '';
          for (let i = 0; i < parseInt(n, 10); i++) value += cookieGet(key + '__' + i) || '';
          return value || null;
        },
        setItem: (key, value) => {
          if (!burseGetRemember()) { sessionStorage.setItem(key, value); return; }
          cookieRemove(key + '__n');
          if (value.length <= CHUNK_SIZE) { cookieSet(key, value, 30); return; }
          cookieRemove(key);
          const chunks = [];
          for (let i = 0; i < value.length; i += CHUNK_SIZE) chunks.push(value.slice(i, i + CHUNK_SIZE));
          chunks.forEach((c, i) => cookieSet(key + '__' + i, c, 30));
          cookieSet(key + '__n', String(chunks.length), 30);
        },
        removeItem: (key) => {
          sessionStorage.removeItem(key);
          const n = cookieGet(key + '__n');
          if (n !== null) { for (let i = 0; i < parseInt(n, 10); i++) cookieRemove(key + '__' + i); cookieRemove(key + '__n'); }
          cookieRemove(key);
        },
      };
    })();

    const { createClient } = supabase;
    const sb = createClient(
      'https://pnpfurfodmejdggnyjof.supabase.co',
      'sb_publishable_q2fnC5EJrToRNuvUjW619Q_NKMbO0iX',
      { auth: { storage: burseAuthStorage, persistSession: true, autoRefreshToken: true } }
    );

    function money(n) { return 'R ' + Number(n||0).toLocaleString('en-ZA', { minimumFractionDigits: 2 }); }
    function esc(str) { return String(str??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    (async function () {
      const sheet = document.getElementById('sheet');
      try {
      const { data: sessionData } = await sb.auth.getSession();
      if (!sessionData.session) { window.location.href = '/login'; return; }

      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) { sheet.innerHTML = '<div class="error">No payslip specified.</div>'; return; }

      const { data: p, error } = await sb
        .from('payroll_payslips')
        .select('*, payroll_staff(*), payroll_runs(*, payroll_companies(*))')
        .eq('id', id)
        .single();

      if (error || !p) { sheet.innerHTML = `<div class="error">Payslip not found, or you do not have access to it.${error ? `<br><span style="font-size:0.72rem;color:#b3b8c4">${esc(error.message)}</span>` : ''}</div>`; return; }
      if (!p.payroll_runs) { sheet.innerHTML = '<div class="error">This payslip\'s pay run could not be loaded. Contact your employer.</div>'; return; }

      const staff = p.payroll_staff;
      const run = p.payroll_runs;
      const company = run.payroll_companies;

      const otherDeductions = Array.isArray(p.other_deductions_json) ? p.other_deductions_json : [];
      const fringeBenefits = Array.isArray(p.fringe_benefits_json) ? p.fringe_benefits_json : [];

      const employmentTypeLabel = { permanent: 'Permanent', fixed_term: 'Fixed term', part_time: 'Part time' }[staff?.employment_type] || staff?.employment_type || '—';
      const retirementFundLabel = { pension: 'Pension fund', provident: 'Provident fund', ra: 'Retirement annuity', none: 'None' }[staff?.retirement_fund_type] || staff?.retirement_fund_type || '—';

      sheet.innerHTML = `
        <div class="top">
          <div>
            <h1><span class="b">B</span>urse Payroll</h1>
            <p>Payslip for ${esc(run.period_start)} to ${esc(run.period_end)}</p>
          </div>
          <div style="text-align:right">
            <p style="font-weight:700;color:#0e1c40">${esc(company?.trading_name || '')}</p>
            ${company?.registered_name && company.registered_name !== company.trading_name ? `<p>${esc(company.registered_name)}</p>` : ''}
            ${company?.address ? `<p>${esc(company.address)}</p>` : ''}
            ${company?.company_reg_number ? `<p>Reg. no. ${esc(company.company_reg_number)}</p>` : ''}
            <p>PAYE ${esc(company?.paye_reference || '—')}</p>
            <p>UIF ${esc(company?.uif_reference || '—')}</p>
            ${!company?.sdl_exempt ? `<p>SDL ${esc(company?.sdl_reference || '—')}</p>` : ''}
          </div>
        </div>

        <div class="meta">
          <div><span>Employee</span><span style="font-weight:600">${esc(staff?.full_name)}</span></div>
          <div><span>Employee no.</span><span>${esc(staff?.employee_number || '—')}</span></div>
          <div><span>ID number</span><span>${esc(staff?.id_number || '—')}</span></div>
          <div><span>Tax number</span><span>${esc(staff?.tax_number || '—')}</span></div>
          <div><span>Job title</span><span>${esc(staff?.job_title || '—')}</span></div>
          <div><span>Department</span><span>${esc(staff?.department || '—')}</span></div>
          <div><span>Employment type</span><span>${esc(employmentTypeLabel)}</span></div>
          <div><span>Start date</span><span>${esc(staff?.start_date || '—')}</span></div>
          <div><span>Pay frequency</span><span style="text-transform:capitalize">${esc(staff?.pay_frequency)}</span></div>
          <div><span>Pay date</span><span>${esc(run.pay_date)}</span></div>
          <div><span>Pay period</span><span>${esc(run.period_start)} – ${esc(run.period_end)}</span></div>
          <div><span>Tax year</span><span>${esc(run.tax_year)}</span></div>
          <div><span>Status</span><span style="text-transform:capitalize">${esc(run.status)}</span></div>
          ${staff?.retirement_fund_type ? `<div><span>Retirement fund</span><span>${esc(retirementFundLabel)}</span></div>` : ''}
          ${Number(staff?.medical_aid_dependants) ? `<div><span>Medical aid dependants</span><span>${esc(staff.medical_aid_dependants)}</span></div>` : ''}
        </div>

        ${staff?.bank_name || staff?.bank_account_number ? `
        <h2 class="section">Payment details</h2>
        <div class="meta">
          <div><span>Bank</span><span>${esc(staff?.bank_name || '—')}</span></div>
          <div><span>Account type</span><span>${esc(staff?.account_type || '—')}</span></div>
          <div><span>Account number</span><span>${esc(staff?.bank_account_number || '—')}</span></div>
          <div><span>Branch code</span><span>${esc(staff?.bank_branch_code || '—')}</span></div>
        </div>` : ''}

        <h2 class="section">Earnings</h2>
        <table>
          <tr><td>Basic salary</td><td>${money(p.basic_salary)}</td></tr>
          ${Number(p.travel_allowance) ? `<tr><td>Travel allowance</td><td>${money(p.travel_allowance)}</td></tr>` : ''}
          ${Number(p.other_taxable_allowance) ? `<tr><td>Other taxable allowance</td><td>${money(p.other_taxable_allowance)}</td></tr>` : ''}
          ${Number(p.other_nontaxable_allowance) ? `<tr><td>Other allowance (non-taxable)</td><td>${money(p.other_nontaxable_allowance)}</td></tr>` : ''}
          ${Number(p.once_off_taxable) ? `<tr><td>Bonus / once-off payment</td><td>${money(p.once_off_taxable)}</td></tr>` : ''}
          ${Number(p.once_off_nontaxable) ? `<tr><td>Bonus / once-off payment (non-taxable)</td><td>${money(p.once_off_nontaxable)}</td></tr>` : ''}
          <tr class="total-row"><td>Gross pay</td><td>${money(p.gross_pay)}</td></tr>
        </table>

        ${fringeBenefits.length ? `
        <h2 class="section">Taxable fringe benefits <span style="font-weight:400;font-size:0.72rem;color:#7a8fb0">(non-cash, added to taxable income only)</span></h2>
        <table>
          ${fringeBenefits.map(f => `<tr><td>${esc(f.label)}</td><td>${money(f.amount)}</td></tr>`).join('')}
        </table>` : ''}

        <h2 class="section">Deductions</h2>
        <table>
          <tr><td>PAYE (income tax)${Number(p.once_off_tax) ? ` <span style="color:#7a8fb0;font-size:0.75rem">(incl. ${money(p.once_off_tax)} on bonus)</span>` : ''}</td><td>${money(p.paye)}</td></tr>
          <tr><td>UIF contribution</td><td>${money(p.uif_employee)}</td></tr>
          ${Number(p.retirement_contribution) ? `<tr><td>Retirement fund contribution</td><td>${money(p.retirement_contribution)}</td></tr>` : ''}
          ${Number(p.loan_repayment) ? `<tr><td>Loan repayment</td><td>${money(p.loan_repayment)}</td></tr>` : ''}
          ${otherDeductions.map(d => `<tr><td>${esc(d.label)}</td><td>${money(d.amount)}</td></tr>`).join('')}
          <tr class="total-row"><td>Total deductions</td><td>${money(p.total_deductions)}</td></tr>
        </table>

        <div class="net-box">
          <span class="label">Net pay</span>
          <span class="val">${money(p.net_pay)}</span>
        </div>

        <h2 class="section">Year to date</h2>
        <table>
          <tr><td>YTD gross</td><td>${money(p.ytd_gross)}</td></tr>
          <tr><td>YTD PAYE</td><td>${money(p.ytd_paye)}</td></tr>
          <tr><td>YTD UIF</td><td>${money(p.ytd_uif_employee)}</td></tr>
        </table>

        <p class="foot">
          Employer UIF contribution this period: ${money(p.uif_employer)} (not deducted from employee).
          ${company?.sdl_exempt ? '' : `SDL contribution: ${money(p.sdl_employer)} (employer-only, not deducted from employee).`}
          ${Number(p.eti_employer) ? ` Employment Tax Incentive claimed by employer: ${money(p.eti_employer)}.` : ''}
          This payslip is issued in terms of Section 33 of the Basic Conditions of Employment Act, 1997.
        </p>
      `;
      document.getElementById('btnRow').style.display = 'flex';
      window.__payslipFilename = `Payslip-${(staff?.full_name || 'employee').replace(/[^a-z0-9]+/gi, '-')}-${run.period_start}`;
      } catch (e) {
        console.error('Payslip render failed:', e);
        sheet.innerHTML = `<div class="error">Something went wrong showing this payslip.<br><span style="font-size:0.72rem;color:#b3b8c4">${esc(e && e.message || String(e))}</span></div>`;
        document.getElementById('btnRow').style.display = 'none';
      }
    })();

    // Loaded on demand so a plain print doesn't pay for a PDF library it
    // doesn't need — html2pdf.js bundles html2canvas + jsPDF.
    function loadHtml2Pdf() {
      if (window.html2pdf) return Promise.resolve();
      if (window.__html2pdfLoading) return window.__html2pdfLoading;
      window.__html2pdfLoading = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js';
        s.onload = resolve;
        s.onerror = () => reject(new Error('Could not load the PDF generator. Check your connection and try again.'));
        document.head.appendChild(s);
      });
      return window.__html2pdfLoading;
    }

    async function downloadPdf() {
      const btn = document.getElementById('downloadBtn');
      const original = btn.textContent;
      btn.disabled = true; btn.textContent = 'Preparing…';
      try {
        await loadHtml2Pdf();
        const sheetEl = document.getElementById('sheet');
        await window.html2pdf()
          .set({
            filename: `${window.__payslipFilename || 'payslip'}.pdf`,
            margin: 10,
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
            html2canvas: { scale: 2, useCORS: true },
            pagebreak: { mode: ['css', 'legacy'], avoid: ['tr', '.net-box', '.meta'] },
          })
          .from(sheetEl)
          .save();
      } catch (e) {
        alert(e.message || 'Could not generate the PDF. Try Print instead and choose "Save as PDF".');
      } finally {
        btn.disabled = false; btn.textContent = original;
      }
    }
  </script>
</body>
</html>
