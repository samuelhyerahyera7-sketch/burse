<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Payroll — Burse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy-dark: #0e1c40; --teal: #2ab3b3; --teal-dark: #1e9090; --teal-light: #e6f7f7;
      --text: #0e1c40; --text-mid: #3d5070; --text-soft: #7a8fb0; --border: #e6eaf0;
    }
    body { font-family: 'Inter', system-ui, sans-serif; color: var(--text); background: #fff; line-height: 1.5; }
    a { text-decoration: none; color: inherit; }

    .topnav { display: flex; align-items: center; gap: 16px; padding: 16px 24px; border-bottom: 1px solid var(--border); }
    .brand { font-size: 1.2rem; font-weight: 900; letter-spacing: -0.04em; }
    .brand-b { color: var(--teal); }
    .logout { margin-left: auto; font-size: 0.85rem; font-weight: 600; color: var(--text-mid); cursor: pointer; background: none; border: none; font-family: inherit; }
    .logout:hover { color: var(--navy-dark); }

    .wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }
    .page-head { margin-bottom: 22px; }
    .page-head h1 { font-size: 1.5rem; font-weight: 900; color: var(--navy-dark); }
    .page-head p { font-size: 0.88rem; color: var(--text-mid); margin-top: 4px; }

    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .tab { padding: 10px 16px; font-size: 0.88rem; font-weight: 700; color: var(--text-soft); cursor: pointer; border-bottom: 2px solid transparent; }
    .tab.active { color: var(--navy-dark); border-bottom-color: var(--teal); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .bal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .bal-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .bal-card .lbl { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-soft); margin-bottom: 8px; }
    .bal-card .val { font-size: 1.5rem; font-weight: 900; color: var(--navy-dark); }
    .bal-card .sub { font-size: 0.76rem; color: var(--text-soft); margin-top: 4px; }

    .card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
    .card h2 { font-size: 0.92rem; font-weight: 800; margin-bottom: 16px; color: var(--navy-dark); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--text-mid); margin-bottom: 5px; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 0.85rem; font-family: 'Inter', sans-serif; color: var(--text); outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--teal); }

    table { width: 100%; border-collapse: collapse; }
    th { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-soft); padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    td { font-size: 0.83rem; padding: 10px; border-bottom: 1px solid var(--border); }
    tr:last-child td { border-bottom: none; }

    .badge { display: inline-flex; font-size: 0.66rem; font-weight: 700; padding: 3px 8px; border-radius: 50px; }
    .badge-yellow { background: #fef3c7; color: #b45309; } .badge-green { background: #dcfce7; color: #15803d; }
    .badge-red { background: #fee2e2; color: #dc2626; } .badge-gray { background: #f1f5f9; color: #64748b; }

    .btn { padding: 10px 20px; background: var(--navy-dark); color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: 'Inter', sans-serif; font-size: 0.85rem; }
    .btn:hover { background: #162050; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-outline { padding: 7px 14px; border: 1.5px solid var(--border); border-radius: 8px; font-weight: 700; font-size: 0.78rem; color: var(--navy-dark); cursor: pointer; background: #fff; }
    .btn-outline:hover { border-color: var(--navy-dark); }

    .qa-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 20px; }
    .qa-btn { background: var(--teal-light); border: 1px solid var(--border); border-radius: 12px; padding: 14px; font-weight: 700; font-size: 0.82rem; color: var(--navy-dark); cursor: pointer; text-align: left; font-family: inherit; }
    .qa-btn:hover { border-color: var(--teal); }
    .hi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-bottom: 20px; }
    .hi-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
    .hi-card .lbl { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-soft); margin-bottom: 6px; }
    .hi-card .val { font-size: 1.25rem; font-weight: 900; color: var(--navy-dark); }
    .ann-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
    .ann-item:last-child { border-bottom: none; }
    .ann-item .t { font-weight: 800; font-size: 0.88rem; color: var(--navy-dark); }
    .ann-item .b { font-size: 0.82rem; color: var(--text-mid); margin-top: 4px; white-space: pre-wrap; }
    .ann-item .d { font-size: 0.7rem; color: var(--text-soft); margin-top: 6px; }
    .clock-status { display: flex; align-items: center; gap: 14px; padding: 18px; background: var(--teal-light); border-radius: 14px; margin-bottom: 16px; }
    .clock-dot { width: 12px; height: 12px; border-radius: 50%; background: #94a3b8; }
    .clock-dot.in { background: #15803d; }
    .sigpad-canvas { border: 1.5px dashed var(--border); border-radius: 10px; width: 100%; height: 140px; touch-action: none; cursor: crosshair; }
    .chat-log { max-height: 340px; overflow-y: auto; margin-bottom: 14px; }
    .chat-msg { padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; font-size: 0.85rem; max-width: 85%; }
    .chat-msg.user { background: var(--navy-dark); color: #fff; margin-left: auto; }
    .chat-msg.ai { background: var(--teal-light); color: var(--text); }
    .empty { text-align: center; padding: 24px; color: var(--text-soft); font-size: 0.85rem; }
    .error-box { display: none; background: #fff0f0; border: 1px solid #fca5a5; color: #dc2626; font-size: 0.8rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; }
    .gate { text-align: center; padding: 80px 20px; color: var(--text-soft); }
    .gate a { color: var(--teal); font-weight: 700; }

    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(14,28,64,0.5); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #fff; border-radius: 16px; padding: 24px; max-width: 460px; width: 100%; }
    .modal-box h3 { font-size: 1.05rem; font-weight: 800; margin-bottom: 6px; color: var(--navy-dark); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  </style>
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="/"><span class="brand-b">B</span>urse</a>
    <button class="logout" id="logoutBtn">Log out</button>
  </nav>

  <div class="wrap" id="app">
    <div class="gate">Loading your payroll information…</div>
  </div>

  <div class="modal-overlay" id="signModal">
    <div class="modal-box">
      <h3 id="signModalTitle">Sign document</h3>
      <p style="font-size:0.82rem;color:var(--text-mid);margin-bottom:14px" id="signModalDesc"></p>
      <div class="form-group"><label>Type your full name to confirm</label><input id="sig-typed-name" placeholder="Your full name"></div>
      <div class="form-group"><label>Draw your signature (optional)</label>
        <canvas id="sigCanvas" class="sigpad-canvas"></canvas>
        <button type="button" class="btn-outline" style="margin-top:6px" onclick="clearSignaturePad()">Clear</button>
      </div>
      <div class="error-box" id="signModalError"></div>
      <div class="modal-actions">
        <button class="btn-outline" onclick="closeSignModal()">Cancel</button>
        <button class="btn" id="submitSignBtn" onclick="submitSignature()">Sign</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Must match the storage adapter in login.html exactly — see comment there.
    // On the real burse.co.za domain this uses a Domain=.burse.co.za cookie
    // so this session is also visible to Bookkeeping's own subdomain.
    function burseGetRemember() { return localStorage.getItem('burse-remember') !== '0'; }
    function burseSetRemember(v) { localStorage.setItem('burse-remember', v ? '1' : '0'); }

    const burseAuthStorage = (() => {
      const onProdDomain = location.hostname.endsWith('burse.co.za');
      if (!onProdDomain) {
        return {
          getItem: (key) => (burseGetRemember() ? window.localStorage : window.sessionStorage).getItem(key),
          setItem: (key, value) => (burseGetRemember() ? window.localStorage : window.sessionStorage).setItem(key, value),
          removeItem: (key) => (burseGetRemember() ? window.localStorage : window.sessionStorage).removeItem(key),
        };
      }
      const COOKIE_DOMAIN = '.burse.co.za';
      const CHUNK_SIZE = 3000;
      function cookieGet(name) {
        const m = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '=([^;]*)'));
        return m ? decodeURIComponent(m[1]) : null;
      }
      function cookieSet(name, value, days) {
        document.cookie = `${name}=${encodeURIComponent(value)}; path=/; domain=${COOKIE_DOMAIN}; max-age=${days * 86400}; samesite=lax; secure`;
      }
      function cookieRemove(name) {
        document.cookie = `${name}=; path=/; domain=${COOKIE_DOMAIN}; max-age=0`;
      }
      return {
        getItem: (key) => {
          if (!burseGetRemember()) return sessionStorage.getItem(key);
          const n = cookieGet(key + '__n');
          if (n === null) return cookieGet(key);
          let value = '';
          for (let i = 0; i < parseInt(n, 10); i++) value += cookieGet(key + '__' + i) || '';
          return value || null;
        },
        setItem: (key, value) => {
          if (!burseGetRemember()) { sessionStorage.setItem(key, value); return; }
          cookieRemove(key + '__n');
          if (value.length <= CHUNK_SIZE) { cookieSet(key, value, 30); return; }
          cookieRemove(key);
          const chunks = [];
          for (let i = 0; i < value.length; i += CHUNK_SIZE) chunks.push(value.slice(i, i + CHUNK_SIZE));
          chunks.forEach((c, i) => cookieSet(key + '__' + i, c, 30));
          cookieSet(key + '__n', String(chunks.length), 30);
        },
        removeItem: (key) => {
          sessionStorage.removeItem(key);
          const n = cookieGet(key + '__n');
          if (n !== null) { for (let i = 0; i < parseInt(n, 10); i++) cookieRemove(key + '__' + i); cookieRemove(key + '__n'); }
          cookieRemove(key);
        },
      };
    })();

    const { createClient } = supabase;
    const sb = createClient(
      'https://pnpfurfodmejdggnyjof.supabase.co',
      'sb_publishable_q2fnC5EJrToRNuvUjW619Q_NKMbO0iX',
      { auth: { storage: burseAuthStorage, persistSession: true, autoRefreshToken: true } }
    );

    let staff = null;
    let dashData = null;
    let authSession = null;

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await sb.auth.signOut();
      window.location.href = '/login';
    });

    function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function money(n) { return 'R ' + Number(n||0).toLocaleString('en-ZA', { minimumFractionDigits: 2 }); }
    function leaveBadge(status) {
      if (status === 'approved') return '<span class="badge badge-green">Approved</span>';
      if (status === 'rejected') return '<span class="badge badge-red">Rejected</span>';
      if (status === 'cancelled') return '<span class="badge badge-gray">Cancelled</span>';
      return '<span class="badge badge-yellow">Pending</span>';
    }

    (async function init() {
      const { data } = await sb.auth.getSession();
      if (!data.session) { window.location.href = '/login'; return; }
      authSession = data.session;

      await sb.rpc('claim_payroll_staff_invites');

      const { data: s } = await sb.from('payroll_staff').select('*').eq('user_id', data.session.user.id).maybeSingle();
      const app = document.getElementById('app');

      if (!s) {
        app.innerHTML = `<div class="gate">
          You're not linked to a Burse Payroll company yet.<br>
          Ask your employer to add you as staff using this account's email address,
          or <a href="mailto:hello@burse.co.za">contact us</a> if you think this is a mistake.
        </div>`;
        return;
      }
      staff = s;
      await render();
    })();

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + name));
    }

    async function render() {
      const app = document.getElementById('app');
      const [
        { data: balances }, { data: requests }, { data: payslips },
        { data: advanceReqs }, { data: overtimeReqs }, { data: clockEvents },
        { data: announcements }, { data: documents },
      ] = await Promise.all([
        sb.from('payroll_leave_balances').select('*').eq('staff_id', staff.id).order('cycle_start', { ascending: false }),
        sb.from('payroll_leave_requests').select('*').eq('staff_id', staff.id).order('requested_at', { ascending: false }),
        sb.from('payroll_payslips').select('*, payroll_runs(*)').eq('staff_id', staff.id).order('created_at', { ascending: false }),
        sb.from('payroll_advance_requests').select('*').eq('staff_id', staff.id).order('requested_at', { ascending: false }),
        sb.from('payroll_overtime_requests').select('*').eq('staff_id', staff.id).order('requested_at', { ascending: false }),
        sb.from('payroll_clock_events').select('*').eq('staff_id', staff.id).order('occurred_at', { ascending: false }).limit(30),
        sb.from('payroll_announcements').select('*').eq('company_id', staff.company_id).order('created_at', { ascending: false }).limit(10),
        sb.from('payroll_staff_documents').select('*').eq('staff_id', staff.id).order('uploaded_at', { ascending: false }),
      ]);

      dashData = { balances, requests, payslips, advanceReqs, overtimeReqs, clockEvents, announcements, documents };

      const latestByType = {};
      (balances || []).forEach(b => { if (!latestByType[b.leave_type]) latestByType[b.leave_type] = b; });
      const typeLabels = { annual: 'Annual leave', sick: 'Sick leave', family_responsibility: 'Family responsibility' };
      const taxYears = [...new Set((payslips || []).map(p => p.payroll_runs?.tax_year).filter(Boolean))].sort().reverse();
      const latestPayslip = (payslips || [])[0];
      const lastClockEvent = (clockEvents || [])[0];
      const isClockedIn = lastClockEvent?.event_type === 'in';
      const pendingCount = (requests || []).filter(r => r.status === 'pending').length
        + (advanceReqs || []).filter(r => r.status === 'pending').length
        + (overtimeReqs || []).filter(r => r.status === 'pending').length;

      app.innerHTML = `
        <div class="page-head"><h1>My Payroll</h1><p>Welcome, ${esc(staff.full_name)}.</p></div>

        <div class="tabs">
          <div class="tab active" data-tab="dashboard" onclick="switchTab('dashboard')">Dashboard</div>
          <div class="tab" data-tab="payslips" onclick="switchTab('payslips')">Payslips</div>
          <div class="tab" data-tab="leave" onclick="switchTab('leave')">Leave</div>
          <div class="tab" data-tab="requests" onclick="switchTab('requests')">Requests &amp; Time</div>
          <div class="tab" data-tab="documents" onclick="switchTab('documents')">Documents</div>
          <div class="tab" id="teamTab" style="display:none" data-tab="team" onclick="switchTab('team')">Team</div>
          <div class="tab" data-tab="details" onclick="switchTab('details')">My Details</div>
        </div>

        <div class="tab-panel active" id="panel-dashboard">
          <div class="hi-grid">
            <div class="hi-card"><div class="lbl">Latest net pay</div><div class="val">${latestPayslip ? money(latestPayslip.net_pay) : '—'}</div></div>
            <div class="hi-card"><div class="lbl">Last pay date</div><div class="val" style="font-size:1.05rem">${latestPayslip?.payroll_runs?.pay_date || '—'}</div></div>
            <div class="hi-card"><div class="lbl">Pending requests</div><div class="val">${pendingCount}</div></div>
            <div class="hi-card"><div class="lbl">Clock status</div><div class="val" style="font-size:1.05rem;display:flex;align-items:center;gap:8px"><span class="clock-dot ${isClockedIn ? 'in' : ''}"></span>${isClockedIn ? 'Clocked in' : 'Clocked out'}</div></div>
          </div>

          <div class="qa-grid">
            <button class="qa-btn" onclick="switchTab('leave')">Request Leave</button>
            <button class="qa-btn" onclick="switchTab('requests')">Request Advance</button>
            <button class="qa-btn" onclick="switchTab('requests')">Submit Overtime</button>
            <button class="qa-btn" onclick="switchTab('requests')">${isClockedIn ? 'Clock Out' : 'Clock In'}</button>
          </div>

          <div class="bal-grid">
            ${Object.keys(typeLabels).map(t => {
              const b = latestByType[t];
              const balance = b ? (Number(b.entitled_days) - Number(b.taken_days)).toFixed(1) : '—';
              return `<div class="bal-card">
                <div class="lbl">${typeLabels[t]}</div>
                <div class="val">${balance}</div>
                <div class="sub">${b ? `${Number(b.taken_days).toFixed(1)} taken of ${Number(b.entitled_days).toFixed(1)}` : 'Not yet calculated'}</div>
              </div>`;
            }).join('')}
          </div>

          ${latestPayslip ? `<div class="card">
            <h2>Your benefits (this payslip)</h2>
            <div class="bal-grid" style="margin-bottom:0">
              <div class="bal-card"><div class="lbl">Retirement fund</div><div class="val" style="font-size:1.1rem">${money(latestPayslip.retirement_contribution)}</div><div class="sub">${esc(staff.retirement_fund_type || 'none')}</div></div>
              <div class="bal-card"><div class="lbl">UIF (your share)</div><div class="val" style="font-size:1.1rem">${money(latestPayslip.uif_employee)}</div><div class="sub">1% of remuneration</div></div>
              <div class="bal-card"><div class="lbl">Medical aid</div><div class="val" style="font-size:1.1rem">${staff.medical_aid_dependants > 0 ? staff.medical_aid_dependants + ' member(s)' : 'None'}</div><div class="sub">On record</div></div>
            </div>
          </div>` : ''}

          <div class="card">
            <h2>Company announcements</h2>
            ${(!announcements || announcements.length === 0) ? '<div class="empty">No announcements yet.</div>' :
              announcements.map(a => `<div class="ann-item">
                <div class="t">${esc(a.title)}</div>
                <div class="b">${esc(a.body)}</div>
                <div class="d">${new Date(a.created_at).toLocaleString()}</div>
              </div>`).join('')}
          </div>

          <div class="card">
            <h2>Ask about your pay or leave</h2>
            <p style="font-size:0.82rem;color:var(--text-mid);margin-bottom:14px">e.g. "Why was my PAYE higher this month?" or "How many leave days do I have left?"</p>
            <div class="chat-log" id="chatLog"></div>
            <div class="error-box" id="chatError"></div>
            <div class="form-row" style="grid-template-columns:1fr auto">
              <div class="form-group"><input id="chat-question" placeholder="Ask a question…" onkeydown="if(event.key==='Enter')askAssistant()"></div>
              <div class="form-group"><button class="btn" id="askBtn" onclick="askAssistant()">Ask</button></div>
            </div>
          </div>
        </div>

        <div class="tab-panel" id="panel-payslips">
          <div class="card">
            <h2>Your payslips</h2>
            ${(!payslips || payslips.length === 0) ? '<div class="empty">No payslips yet.</div>' : `
            <table><thead><tr><th>Period</th><th>Pay date</th><th>Net pay</th><th></th></tr></thead><tbody>
              ${payslips.map(p => `<tr>
                <td>${esc(p.payroll_runs?.period_start)} – ${esc(p.payroll_runs?.period_end)}</td>
                <td>${esc(p.payroll_runs?.pay_date)}</td>
                <td>${money(p.net_pay)}</td>
                <td><a class="btn-outline" href="/payslip.html?id=${p.id}" target="_blank">View</a></td>
              </tr>`).join('')}
            </tbody></table>`}
          </div>
          ${taxYears.length ? `<div class="card">
            <h2>Tax certificates</h2>
            <p style="font-size:0.82rem;color:var(--text-mid);margin-bottom:14px">A summary of your annual figures in SARS IRP5 format, for completing or checking your official tax return.</p>
            <table><thead><tr><th>Tax year</th><th></th></tr></thead><tbody>
              ${taxYears.map(y => `<tr>
                <td>${esc(y)}</td>
                <td><a class="btn-outline" href="/tax-certificate.html?staff_id=${staff.id}&tax_year=${encodeURIComponent(y)}" target="_blank">View</a></td>
              </tr>`).join('')}
            </tbody></table>
          </div>` : ''}
        </div>

        <div class="tab-panel" id="panel-leave">
          <div class="bal-grid">
            ${Object.keys(typeLabels).map(t => {
              const b = latestByType[t];
              const balance = b ? (Number(b.entitled_days) - Number(b.taken_days)).toFixed(1) : '—';
              return `<div class="bal-card">
                <div class="lbl">${typeLabels[t]}</div>
                <div class="val">${balance}</div>
                <div class="sub">${b ? `${Number(b.taken_days).toFixed(1)} taken of ${Number(b.entitled_days).toFixed(1)}` : 'Not yet calculated'}</div>
              </div>`;
            }).join('')}
          </div>

          <div class="card">
            <h2>Request leave</h2>
            <div class="error-box" id="reqError"></div>
            <div class="form-row">
              <div class="form-group"><label>Leave type</label>
                <select id="req-type">
                  <option value="annual">Annual leave</option>
                  <option value="sick">Sick leave</option>
                  <option value="family_responsibility">Family responsibility</option>
                  <option value="unpaid">Unpaid leave</option>

    // ── Biometric unlock (WebAuthn platform authenticator, device-local only) ──
    // Registers a Face ID/Touch ID/fingerprint credential as a local gate on
    // this browser. It does not add server-verified passwordless login — a
    // successful assertion just means we trust the already-stored "stay
    // logged in" session instead of asking for the password again.
    function b64urlEncode(buf) {
      return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function biometricSupported() { return !!(window.PublicKeyCredential && navigator.credentials); }
    function updateBiometricButtonState() {
      const btn = document.getElementById('bioToggleBtn');
      if (!btn) return;
      if (!biometricSupported()) { btn.disabled = true; btn.textContent = 'Not supported on this device'; return; }
      btn.textContent = localStorage.getItem('burse-biometric-cred') ? 'Disable on this device' : 'Enable on this device';
    }
    async function toggleBiometricUnlock() {
      const btn = document.getElementById('bioToggleBtn');
      if (localStorage.getItem('burse-biometric-cred')) {
        localStorage.removeItem('burse-biometric-cred');
        updateBiometricButtonState();
        return;
      }
      try {
        btn.disabled = true; btn.textContent = 'Follow the prompt…';
        const challenge = crypto.getRandomValues(new Uint8Array(32));
        const userId = crypto.getRandomValues(new Uint8Array(16));
        const cred = await navigator.credentials.create({
          publicKey: {
            challenge, rp: { name: 'Burse' },
            user: { id: userId, name: authSession.user.email, displayName: authSession.user.email },
            pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
            authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
            timeout: 60000,
          },
        });
        if (!cred) throw new Error('No credential returned.');
        localStorage.setItem('burse-biometric-cred', JSON.stringify({ id: b64urlEncode(cred.rawId), email: authSession.user.email }));
      } catch (e) {
        alert('Could not enable biometric unlock: ' + e.message);
      } finally {
        btn.disabled = false;
        updateBiometricButtonState();
      }
    }

    function businessDaysBetween(startStr, endStr) {
      const start = new Date(startStr), end = new Date(endStr);
      let days = 0;
      for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        const day = d.getDay();
        if (day !== 0 && day !== 6) days++;
      }
      return days;
    }

    function getLocationBestEffort() {
      return new Promise(resolve => {
        if (!navigator.geolocation) { resolve(null); return; }
        navigator.geolocation.getCurrentPosition(
          pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
          () => resolve(null),
          { timeout: 4000 },
        );
      });
    }

        lat: loc?.lat ?? null, lng: loc?.lng ?? null,

      await render();
      switchTab('requests');
    }

    function setupSignaturePad() {

      canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight;
      sigPadCtx = canvas.getContext('2d');
      sigPadCtx.strokeStyle = '#0e1c40'; sigPadCtx.lineWidth = 2; sigPadCtx.lineCap = 'round';
      const pos = e => {
        const r = canvas.getBoundingClientRect();
        const p = e.touches ? e.touches[0] : e;
        return { x: p.clientX - r.left, y: p.clientY - r.top };
      };
      canvas.onpointerdown = e => { sigPadDrawing = true; const p = pos(e); sigPadCtx.beginPath(); sigPadCtx.moveTo(p.x, p.y); };
      canvas.onpointermove = e => { if (!sigPadDrawing) return; const p = pos(e); sigPadCtx.lineTo(p.x, p.y); sigPadCtx.stroke(); };
      window.addEventListener('pointerup', () => { sigPadDrawing = false; });
    }
    function clearSignaturePad() {
      const canvas = document.getElementById('sigCanvas');
      sigPadCtx?.clearRect(0, 0, canvas.width, canvas.height);
    }

    let signingDocId = null;
    function openSignModal(docId) {
      const doc = signDocsCache.find(d => d.id === docId);
      if (!doc) return;
      signingDocId = docId;
      document.getElementById('signModalTitle').textContent = doc.title;
      document.getElementById('signModalDesc').textContent = doc.description || '';
      document.getElementById('sig-typed-name').value = staff.full_name || '';
      document.getElementById('signModalError').style.display = 'none';
      document.getElementById('signModal').classList.add('open');
      setTimeout(setupSignaturePad, 0);
    }
    function closeSignModal() {
      document.getElementById('signModal').classList.remove('open');
      signingDocId = null;
    }
    async function submitSignature() {
      const errEl = document.getElementById('signModalError');
      errEl.style.display = 'none';
      const typedName = document.getElementById('sig-typed-name').value.trim();
      if (!typedName) { errEl.textContent = 'Type your full name to confirm.'; errEl.style.display = 'block'; return; }
      const canvas = document.getElementById('sigCanvas');
      const signatureImage = canvas.toDataURL('image/png');

      const btn = document.getElementById('submitSignBtn');
      btn.disabled = true; btn.textContent = 'Signing…';
      const { error } = await sb.from('payroll_document_signatures').insert({
        document_id: signingDocId, staff_id: staff.id, typed_name: typedName, signature_image: signatureImage,
      });
      btn.disabled = false; btn.textContent = 'Sign';
      if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
      closeSignModal();
      await loadSignDocsForEmployee();
    }

    // ── AI payroll assistant ──
    async function askAssistant() {
      const input = document.getElementById('chat-question');
      const question = input.value.trim();
      const errEl = document.getElementById('chatError');
      errEl.style.display = 'none';
      if (!question) return;
      const log = document.getElementById('chatLog');
      log.innerHTML += `<div class="chat-msg user">${esc(question)}</div>`;
      log.scrollTop = log.scrollHeight;
      input.value = '';
      const btn = document.getElementById('askBtn');
      btn.disabled = true; btn.textContent = '…';

      const { data, error } = await sb.functions.invoke('ai-payroll-assistant', { body: { question } });
      btn.disabled = false; btn.textContent = 'Ask';

      if (error || data?.error) {
        errEl.textContent = data?.error || error.message; errEl.style.display = 'block'; return;
      }
      log.innerHTML += `<div class="chat-msg ai">${esc(data.answer)}</div>`;
      log.scrollTop = log.scrollHeight;
    }

    async function saveMyDetails() {
      const errEl = document.getElementById('detailsError');
      const okEl = document.getElementById('detailsSuccess');
      errEl.style.display = 'none'; okEl.style.display = 'none';

      const btn = document.getElementById('saveDetailsBtn');
      btn.disabled = true; btn.textContent = 'Saving…';

      const { data: updated, error } = await sb.rpc('update_my_staff_details', {
        p_phone: document.getElementById('det-phone').value,
        p_email: document.getElementById('det-email').value,
        p_bank_name: document.getElementById('det-bankname').value,
        p_bank_account_number: document.getElementById('det-accnum').value,
        p_bank_branch_code: document.getElementById('det-branchcode').value,
        p_account_type: document.getElementById('det-accounttype').value,
      });

      btn.disabled = false; btn.textContent = 'Save Changes';

      if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
      staff = updated;
      okEl.textContent = 'Saved.';
      okEl.style.display = 'block';
    }
  </script>
</body>
</html>
