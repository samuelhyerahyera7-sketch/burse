<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — Burse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    html, body {
      min-height: 100%;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      padding: 24px 0;
    }

    .login-wrap {
      width: 100%;
      max-width: 400px;
      padding: 16px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 20px;
    }
    .login-logo a {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-decoration: none;
    }
    .login-logo .brand-b  { color: #2ab3b3; }
    .login-logo .brand-urse { color: #0e1c40; }

    .login-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 24px;
      box-shadow: 0 8px 40px rgba(10,20,60,0.06);
      border: 1px solid #e2e8f0;
    }

    .login-card h2 {
      font-size: 1.3rem;
      font-weight: 800;
      color: #0e1c40;
      margin-bottom: 4px;
    }
    .login-card > p {
      font-size: 0.82rem;
      color: #7a8fb0;
      margin-bottom: 16px;
    }

    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #3d5070;
      margin-bottom: 5px;
    }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 0.88rem;
      font-family: 'Inter', sans-serif;
      color: #0e1c40;
      background: #f8f9fb;
      transition: border-color 0.18s, box-shadow 0.18s;
      outline: none;
    }
    .form-group input:focus {
      border-color: #2ab3b3;
      box-shadow: 0 0 0 3px rgba(42,179,179,0.15);
      background: #fff;
    }
    .form-group input::placeholder { color: #b0bec5; }

    .forgot {
      text-align: right;
      margin-top: -6px;
      margin-bottom: 16px;
    }
    .forgot a {
      font-size: 0.76rem;
      color: #2ab3b3;
      font-weight: 600;
      text-decoration: none;
    }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 42px; }
    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #b0bec5;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .password-toggle:hover { color: #7a8fb0; }
    .password-toggle svg { width: 18px; height: 18px; }

    .remember-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -6px;
      margin-bottom: 16px;
    }
    .remember-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #3d5070;
      font-weight: 600;
      cursor: pointer;
    }
    .remember-label input { width: auto; margin: 0; cursor: pointer; }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #1a2f72;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.18s, transform 0.18s;
    }
    .btn-login:hover { background: #0e1c40; transform: translateY(-1px); }

    .error-msg {
      display: none;
      background: #fff0f0;
      border: 1px solid #fca5a5;
      color: #dc2626;
      font-size: 0.78rem;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .signup-row {
      text-align: center;
      font-size: 0.82rem;
      color: #7a8fb0;
      margin-top: 14px;
    }
    .signup-row a {
      color: #2ab3b3;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="login-wrap">

    <div class="login-logo">
      <a href="/">
        <span class="brand-b">B</span><span class="brand-urse">urse</span>
      </a>
    </div>

    <div class="login-card">
      <!-- LOGIN FORM (default) -->
      <div id="viewLogin">
        <h2 id="authTitle">Welcome back</h2>
        <p id="loginSubtitle">Log in to run your payroll.</p>

        <div class="error-msg" id="errorMsg"></div>
        <div class="error-msg" id="successMsg" style="background:#e6f7f7;border-color:#2ab3b3;color:#1e9090;">
          Account created! Check your email to confirm, then log in.
        </div>

        <form id="loginForm" onsubmit="handleAuth(event)">
          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
              <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="remember-row">
            <label class="remember-label"><input type="checkbox" id="rememberMe" checked> Stay logged in</label>
            <div class="forgot" id="forgotRow" style="margin:0">
              <a href="#" onclick="handleForgotPassword(event)">Forgot password?</a>
            </div>
          </div>
          <button type="submit" class="btn-login" id="authSubmitBtn">Log In</button>
        </form>

        <div class="signup-row">
          <span id="switchText">Don't have an account?</span>
          <a href="#" id="switchLink" onclick="toggleMode(); return false;">Sign up</a>
        </div>
      </div>

      <!-- RESET PASSWORD FORM (shown after clicking email link) -->
      <div id="viewReset" style="display:none;">
        <h2>Set new password</h2>
        <p>Choose a new password for your account.</p>

        <div class="error-msg" id="resetErrorMsg"></div>

        <form id="resetForm" onsubmit="handleResetPassword(event)">
          <div class="form-group">
            <label for="newPassword">New password</label>
            <input type="password" id="newPassword" placeholder="At least 8 characters" required autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat your new password" required autocomplete="new-password">
          </div>
          <button type="submit" class="btn-login">Update Password</button>
        </form>
      </div>
    </div>

    <button onclick="window.location.href='/'" style="display:block;margin:16px auto 0;font-size:0.85rem;color:#7a8fb0;cursor:pointer;background:none;border:none;font-weight:600;font-family:'Inter',sans-serif;">Back to Burse</button>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // "Stay logged in" support, shared by every page that creates a Supabase
    // client (login.html, payroll-admin.html, leave.html): the actual
    // preference lives in localStorage as a small flag (not the session
    // itself), and this custom storage adapter reads that flag on every
    // call to decide whether the real session goes into localStorage
    // (persists across browser restarts) or sessionStorage (cleared when
    // the tab/browser closes).
    function burseGetRemember() { return localStorage.getItem('burse-remember') !== '0'; }
    function burseSetRemember(v) { localStorage.setItem('burse-remember', v ? '1' : '0'); }
    const burseAuthStorage = {
      getItem: (key) => (burseGetRemember() ? window.localStorage : window.sessionStorage).getItem(key),
      setItem: (key, value) => (burseGetRemember() ? window.localStorage : window.sessionStorage).setItem(key, value),
      removeItem: (key) => (burseGetRemember() ? window.localStorage : window.sessionStorage).removeItem(key),
    };

    const { createClient } = supabase;
    const sb = createClient(
      'https://pnpfurfodmejdggnyjof.supabase.co',
      'sb_publishable_q2fnC5EJrToRNuvUjW619Q_NKMbO0iX',
      { auth: { storage: burseAuthStorage, persistSession: true, autoRefreshToken: true } }
    );

    document.getElementById('rememberMe').checked = burseGetRemember();

    document.getElementById('passwordToggle').addEventListener('click', () => {
      const input = document.getElementById('password');
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      document.getElementById('passwordToggle').setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      document.getElementById('eyeIcon').innerHTML = showing
        ? '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.77 21.77 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    });

    function postLoginDestination() {
      return '/payroll-admin';
    }

    let currentMode = 'login';
    function setMode(mode) {
      currentMode = mode;
      document.getElementById('errorMsg').style.display = 'none';
      document.getElementById('successMsg').style.display = 'none';
      const title = document.getElementById('authTitle');
      const subtitle = document.getElementById('loginSubtitle');
      const btn = document.querySelector('#loginForm .btn-login');
      const switchText = document.getElementById('switchText');
      const switchLink = document.getElementById('switchLink');
      const forgotRow = document.getElementById('forgotRow');
      if (mode === 'login') {
        title.textContent = 'Welcome back';
        subtitle.textContent = 'Log in to run your payroll.';
        btn.textContent = 'Log In';
        switchText.textContent = "Don't have an account?";
        switchLink.textContent = 'Sign up free';
        forgotRow.style.display = 'block';
      } else {
        title.textContent = 'Create your account';
        subtitle.textContent = 'Sign up to start running payroll.';
        btn.textContent = 'Sign Up';
        switchText.textContent = 'Already have an account?';
        switchLink.textContent = 'Log in';
        forgotRow.style.display = 'none';
      }
    }
    function toggleMode() { setMode(currentMode === 'login' ? 'signup' : 'login'); }

    if (new URLSearchParams(window.location.search).get('mode') === 'signup') setMode('signup');

    // Supabase v2 sends recovery links with ?code= (PKCE) or #type=recovery (implicit)
    // Detect either format immediately so we never redirect away from the reset form
    const _isRecovery = new URLSearchParams(window.location.search).has('code')
                     || window.location.hash.includes('type=recovery');

    // Show reset form when Supabase processes the recovery token
    sb.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') {
        document.getElementById('viewLogin').style.display = 'none';
        document.getElementById('viewReset').style.display = 'block';
      }
    });

    // Redirect if already logged in — but never during a recovery flow
    sb.auth.getSession().then(({ data }) => {
      if (data.session && !_isRecovery) {
        window.location.href = postLoginDestination();
      }
    });

    // Races a promise against a hard deadline so a stalled connection can
    // never leave the button stuck on "Logging in..."/"Creating account..."
    // indefinitely — it always resolves, errors, or times out within timeoutMs.
    function withTimeout(promise, timeoutMs = 15000) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error('The request timed out. Check your connection and try again.')), timeoutMs)),
      ]);
    }

    async function handleAuth(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const btn = document.querySelector('#loginForm .btn-login');
      const errorMsg = document.getElementById('errorMsg');
      const successMsg = document.getElementById('successMsg');

      // Must be set before signIn/signUp writes the session, since our
      // storage adapter checks this flag on every read/write.
      burseSetRemember(document.getElementById('rememberMe').checked);

      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
      btn.disabled = true;

      try {
        if (currentMode === 'signup') {
          btn.textContent = 'Creating account...';
          const { error } = await withTimeout(sb.auth.signUp({ email, password }));
          if (error) {
            errorMsg.textContent = error.message;
            errorMsg.style.display = 'block';
            return;
          }
          successMsg.style.display = 'block';
          document.getElementById('loginForm').reset();
          return;
        }

        btn.textContent = 'Logging in...';
        const { data, error } = await withTimeout(sb.auth.signInWithPassword({ email, password }));

        if (error) {
          errorMsg.textContent = error.message || 'Incorrect email or password. Please try again.';
          errorMsg.style.display = 'block';
          document.getElementById('password').value = '';
          document.getElementById('password').focus();
          return;
        }

        window.location.href = postLoginDestination();
        return;
      } catch (e) {
        errorMsg.textContent = e.message || 'Something went wrong. Please try again.';
        errorMsg.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = currentMode === 'signup' ? 'Sign Up' : 'Log In';
      }
    }

    async function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      if (!email) { alert('Enter your email address first.'); return; }
      await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/login' });
      alert('Password reset email sent — check your inbox.');
    }

    async function handleResetPassword(e) {
      e.preventDefault();
      const newPw = document.getElementById('newPassword').value;
      const confirmPw = document.getElementById('confirmPassword').value;
      const errEl = document.getElementById('resetErrorMsg');
      const btn = document.querySelector('#resetForm .btn-login');

      errEl.style.display = 'none';
      if (newPw !== confirmPw) {
        errEl.textContent = 'Passwords do not match.';
        errEl.style.display = 'block';
        return;
      }
      if (newPw.length < 8) {
        errEl.textContent = 'Password must be at least 8 characters.';
        errEl.style.display = 'block';
        return;
      }

      btn.textContent = 'Updating...';
      btn.disabled = true;

      const { error } = await sb.auth.updateUser({ password: newPw });
      if (error) {
        errEl.textContent = error.message;
        errEl.style.display = 'block';
        btn.textContent = 'Update Password';
        btn.disabled = false;
        return;
      }

      alert('Password updated! You can now log in.');
      window.location.href = '/login';
    }
  </script>

</body>
</html>
